name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio cryptography aiosqlite

      - name: Линтер
        run: ruff check .

      - name: Тесты
        run: pytest -q

      - name: Проверка синтаксиса модулей с внешними зависимостями
        # bridge.py тянет pymax и aiogram — в CI их не ставим,
        # поэтому проверяем только то, что файл разбирается.
        run: python -m compileall -q bridge.py config.py registry.py storage.py
